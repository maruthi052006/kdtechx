version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: kdtechx_postgres
    restart: always
    environment:
      POSTGRES_DB: kdtechx_db
      POSTGRES_USER: kdtechx_user
      POSTGRES_PASSWORD: kdtechx_secure_pass_2026
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kdtechx_user -d kdtechx_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
